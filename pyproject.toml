[project]
name = "skinproof"
version = "0.1.0"
description = "Noise-gated skincare progress checks on top of the YouCam AI Skin Analysis API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pillow>=10.4",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "opencv-python-headless==4.10.0.84",
  "mcp>=1.9,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
skinproof = "skinproof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skinproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
